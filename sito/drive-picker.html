<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Importa da Google Drive · UniNotes</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Pagina di servizio per «Importa da Drive» dell'app (lib/features/cloud/
     drive_picker.dart): apre il Google Picker con il token dell'app e torna
     all'app con i soli id dei file scelti. */
  :root { color-scheme: dark; --text: #F3F7FB; --text2: rgba(235,245,255,.75); --c3: #7DD3FC; }
  * { box-sizing: border-box; }
  html { background: #02060f; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font: 400 15px/1.55 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(178deg, #02060f 0%, #041122 55%, #020a16 100%);
  }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--text2); margin: 0 0 16px; }
  a.button {
    display: inline-block; padding: 12px 20px; border-radius: 14px; font-weight: 600;
    background: #38BDF8; color: #02121f; text-decoration: none;
  }
  a.button[hidden] { display: none; }
  a { color: var(--c3); }
</style>
</head>
<body>
<main>
  <h1 id="title">Importa da Google Drive</h1>
  <p id="text">Sto aprendo il selettore di Google Drive…</p>
  <a id="back" class="button" href="#" hidden>Torna a UniNotes</a>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.hash.slice(1));
    // il token non resta nella barra degli indirizzi né nella cronologia
    history.replaceState(null, '', location.pathname);
    var token = params.get('token') || '';
    var key = params.get('key') || '';
    var app = params.get('app') || '';
    var ret = params.get('ret') || '';
    var state = params.get('state') || '';
    var title = document.getElementById('title');
    var text = document.getElementById('text');
    var back = document.getElementById('back');

    // ritorno solo verso l'app: server locale (PC, Mac) o schema del client
    // Google sul telefono
    var allowed = /^http:\/\/127\.0\.0\.1:\d{1,5}\/picker$/.test(ret) ||
      /^com\.googleusercontent\.apps\.[A-Za-z0-9-]+:\/picker$/.test(ret);

    function fail(message) {
      title.textContent = 'Importazione non riuscita';
      text.textContent = message;
    }

    function done(result, message) {
      var q = new URLSearchParams({ state: state });
      Object.keys(result).forEach(function (k) { q.set(k, result[k]); });
      var url = ret + '?' + q.toString();
      title.textContent = message;
      text.textContent = 'Se l\'app non si apre da sola, tocca il pulsante.';
      back.href = url;
      back.hidden = false;
      location.href = url;
    }

    if (!token || !key || !app || !state || !allowed) {
      fail('Apri questa pagina dall\'app: Collegamenti → Google Drive → Importa da Drive.');
      return;
    }

    // il selettore deve aprirsi entro 25 secondi: se Google rifiuta la chiave
    // API (non valida o non autorizzata per questo sito) mostra l'errore
    // dentro la sua finestra senza avvisare la pagina, e l'app resterebbe in
    // attesa. Allora si torna all'app con la causa.
    var loaded = false;
    var answered = false;
    setTimeout(function () {
      if (!loaded && !answered) {
        answered = true;
        done({ error: 'chiave API non valida o selettore non aperto' }, 'Importazione non riuscita');
      }
    }, 25000);

    window.onPickerApi = function () {
      gapi.load('picker', function () {
        var view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setIncludeFolders(true)
          .setSelectFolderEnabled(false);
        var picker = new google.picker.PickerBuilder()
          .addView(view)
          .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
          .setOAuthToken(token)
          .setDeveloperKey(key)
          .setAppId(app)
          .setLocale('it')
          .setTitle('Scegli i file da importare in UniNotes')
          .setCallback(function (data) {
            var action = data[google.picker.Response.ACTION];
            if (action === 'loaded') {
              loaded = true;
              return;
            }
            if (answered) return;
            answered = true;
            if (action === google.picker.Action.PICKED) {
              var ids = (data[google.picker.Response.DOCUMENTS] || []).map(function (d) {
                return d[google.picker.Document.ID];
              });
              done({ ids: ids.join(',') }, 'File scelti');
            } else if (action === google.picker.Action.CANCEL) {
              done({ cancel: '1' }, 'Nessun file scelto');
            } else if (action === 'error') {
              done({ error: 'selettore non disponibile' }, 'Importazione non riuscita');
            } else {
              answered = false;
            }
          })
          .build();
        picker.setVisible(true);
        text.textContent = 'Scegli uno o più file nella finestra di Google Drive.';
      });
    };

    var s = document.createElement('script');
    s.src = 'https://apis.google.com/js/api.js';
    s.async = true;
    s.onload = function () { window.onPickerApi(); };
    s.onerror = function () {
      if (answered) return;
      answered = true;
      done({ error: 'Google non raggiungibile' }, 'Importazione non riuscita');
    };
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
