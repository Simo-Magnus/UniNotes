name: App

# Analisi, test e build di UniNotes per Windows, macOS, Android e iOS.
# Le build non firmate servono per provare l'app; per la pubblicazione negli
# store servono i secret di firma del repository.
on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "database/**"
      - "tools/db_builder/sync_assets.py"
      - ".github/workflows/app.yml"
    tags: ["v*"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    name: Analisi e test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # NDK, whisper.cpp, ffmpeg e librerie video occupano molto spazio: si
      # tolgono dal runner gli strumenti che non servono (.NET, Haskell, CodeQL…).
      - name: Libera spazio su disco
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/microsoft /usr/share/swift
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Solo i file comuni (atenei, indice dei corsi, meta, corsi sostituiti:
      # circa 1 MB). I dati di ogni ateneo l'app li scarica da internet per
      # l'ateneo scelto: niente --completo, la build resta leggera.
      - name: Elenco degli atenei e dei corsi nell'app (i dati dell'ateneo si scaricano)
        shell: bash
        run: python3 ../tools/db_builder/sync_assets.py || python ../tools/db_builder/sync_assets.py
      - name: Modello Whisper integrato (asset delle build Android e iOS, 57 MiB, non nel repository)
        shell: bash
        run: python3 tool/prepara_modello_whisper.py || python tool/prepara_modello_whisper.py
      - name: Licenze Android SDK e NDK (richiesto da whisper_ggml)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" > /dev/null
      - name: Chiave di firma (se configurata nei secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi
      # APK per GitHub Releases (link alle donazioni), uno per processore così
      # ognuno contiene solo le sue librerie native; AAB per Google Play (senza):
      # lì è lo store a mandare a ogni telefono la parte giusta.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 --dart-define=MS_CLIENT_ID=${{ secrets.MS_CLIENT_ID }} --dart-define=GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID_ANDROID }} --dart-define=DONATIONS=link --dart-define=GOOGLE_PICKER_API_KEY=${{ secrets.GOOGLE_PICKER_API_KEY }} --dart-define=GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
      - run: flutter build appbundle --release --target-platform android-arm,android-arm64,android-x64 --dart-define=MS_CLIENT_ID=${{ secrets.MS_CLIENT_ID }} --dart-define=GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID_ANDROID }} --dart-define=STORE=play --dart-define=GOOGLE_PICKER_API_KEY=${{ secrets.GOOGLE_PICKER_API_KEY }} --dart-define=GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
      - uses: actions/upload-artifact@v7
        with:
          name: uninotes-android
          retention-days: 3
          path: |
            app/build/app/outputs/flutter-apk/app-*-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    env:
      # firma facoltativa: i passi partono solo se il secret esiste
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Solo i file comuni (atenei, indice dei corsi, meta, corsi sostituiti:
      # circa 1 MB). I dati di ogni ateneo l'app li scarica da internet per
      # l'ateneo scelto: niente --completo, la build resta leggera.
      - name: Elenco degli atenei e dei corsi nell'app (i dati dell'ateneo si scaricano)
        shell: bash
        run: python3 ../tools/db_builder/sync_assets.py || python ../tools/db_builder/sync_assets.py
      # Parakeet (NVIDIA, CC BY 4.0) incluso nell'app desktop: 670 MB scaricati
      # una volta da Hugging Face con lo SHA-256 controllato, poi presi dalla
      # cache (mai nel repository). Su Windows li installa CMake in
      # data/parakeet accanto a uninotes.exe.
      - name: Cache del modello Parakeet
        uses: actions/cache@v4
        with:
          path: app/build/parakeet
          key: parakeet-tdt-0.6b-v3-int8-acfc2b44
      - name: Modello Parakeet (incluso nell'app, 670 MB, non nel repository)
        shell: bash
        run: python3 tool/prepara_modello_parakeet.py || python tool/prepara_modello_parakeet.py
      - run: flutter build windows --release --dart-define=MS_CLIENT_ID=${{ secrets.MS_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID_DESKTOP }} --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET_DESKTOP }} --dart-define=DONATIONS=link --dart-define=GOOGLE_PICKER_API_KEY=${{ secrets.GOOGLE_PICKER_API_KEY }} --dart-define=GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
      # Firma facoltativa del programma (certificato di firma del codice .pfx
      # in base64 nei secret): senza, il passo non parte e SmartScreen avvisa
      # al primo avvio.
      - name: Firma uninotes.exe (solo con il certificato nei secret)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build/windows/x64/runner/Release/uninotes.exe
      - name: Comprimi
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath uninotes-windows.zip
      # Installatore UniNotes_setup.exe con Inno Setup (gratuito): versione
      # letta da pubspec.yaml, script in app/windows/installer/uninotes.iss.
      - name: Installatore (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value.Split('+')[0]
          & $iscc "/DAppVersion=$version" windows\installer\uninotes.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build\installer\UniNotes_setup.exe UniNotes_setup.exe
      - name: Firma l'installatore (solo con il certificato nei secret)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 UniNotes_setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: uninotes-windows
          retention-days: 3
          path: |
            app/uninotes-windows.zip
            app/UniNotes_setup.exe

  # Pacchetto MSIX per il Microsoft Store, dallo stesso codice della build del
  # sito ma con STORE=microsoft (niente disinstallatore né aggiornamenti
  # dell'app fuori dallo Store). Solo per le versioni definitive: tag v* o
  # avvio manuale del workflow, mai a ogni push. Non firmato (lo firma lo
  # Store); non va nelle release né sul sito: UniNotes.msix si scarica
  # dall'artifact e si carica a mano in Partner Center. Senza i tre secret di
  # Partner Center il job si ferma con un avviso.
  microsoft-store:
    name: Microsoft Store (MSIX)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    env:
      HAS_MSSTORE_IDENTITY: ${{ secrets.MSSTORE_IDENTITY_NAME != '' && secrets.MSSTORE_PUBLISHER != '' && secrets.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Secret di Partner Center
        if: env.HAS_MSSTORE_IDENTITY != 'true'
        working-directory: .
        shell: bash
        run: |
          echo "::warning title=Microsoft Store::Mancano i secret MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER o MSSTORE_PUBLISHER_DISPLAY_NAME (Partner Center → Gestione prodotti → Identità prodotto): pacchetto MSIX non creato."
      - uses: actions/checkout@v7
        if: env.HAS_MSSTORE_IDENTITY == 'true'
      - uses: subosito/flutter-action@v2
        if: env.HAS_MSSTORE_IDENTITY == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: env.HAS_MSSTORE_IDENTITY == 'true'
        run: flutter pub get
      - name: Elenco degli atenei e dei corsi nell'app (i dati dell'ateneo si scaricano)
        if: env.HAS_MSSTORE_IDENTITY == 'true'
        shell: bash
        run: python3 ../tools/db_builder/sync_assets.py || python ../tools/db_builder/sync_assets.py
      # Link alle donazioni ammesso (policy 10.8.2: donazioni volontarie con
      # un servizio di pagamento esterno, da dichiarare in Partner Center).
      # MSSTORE_ID (facoltativo): ID dello Store per «Lascia una recensione».
      # Parakeet (NVIDIA, CC BY 4.0) incluso nell'app desktop: 670 MB scaricati
      # una volta da Hugging Face con lo SHA-256 controllato, poi presi dalla
      # cache (mai nel repository). Su Windows li installa CMake in
      # data/parakeet accanto a uninotes.exe.
      - name: Cache del modello Parakeet
        if: env.HAS_MSSTORE_IDENTITY == 'true'
        uses: actions/cache@v4
        with:
          path: app/build/parakeet
          key: parakeet-tdt-0.6b-v3-int8-acfc2b44
      - name: Modello Parakeet (incluso nell'app, 670 MB, non nel repository)
        if: env.HAS_MSSTORE_IDENTITY == 'true'
        shell: bash
        run: python3 tool/prepara_modello_parakeet.py || python tool/prepara_modello_parakeet.py
      - name: Build Windows per lo Store
        if: env.HAS_MSSTORE_IDENTITY == 'true'
        run: flutter build windows --release --dart-define=STORE=microsoft --dart-define=MSSTORE_ID=${{ secrets.MSSTORE_ID }} --dart-define=MS_CLIENT_ID=${{ secrets.MS_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID_DESKTOP }} --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET_DESKTOP }} --dart-define=DONATIONS=link --dart-define=GOOGLE_PICKER_API_KEY=${{ secrets.GOOGLE_PICKER_API_KEY }} --dart-define=GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
      # Manifest (app/windows/msix/AppxManifest.xml) con identità e versione,
      # icone, resources.pri e makeappx del Windows SDK del runner.
      - name: Pacchetto UniNotes.msix (non firmato)
        if: env.HAS_MSSTORE_IDENTITY == 'true'
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ secrets.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSSTORE_PUBLISHER_DISPLAY_NAME }}
          # nome prenotato in Partner Center (facoltativo: senza, «UniNotes»)
          MSSTORE_DISPLAY_NAME: ${{ secrets.MSSTORE_DISPLAY_NAME }}
        run: ./windows/msix/crea_msix.ps1 -Release build/windows/x64/runner/Release -Output UniNotes.msix
      - uses: actions/upload-artifact@v7
        if: env.HAS_MSSTORE_IDENTITY == 'true'
        with:
          name: uninotes-microsoft-store
          retention-days: 30
          path: app/UniNotes.msix

  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    env:
      # firma e notarizzazione: i passi partono solo se i secret esistono
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_NOTARY_PASSWORD != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Solo i file comuni (atenei, indice dei corsi, meta, corsi sostituiti:
      # circa 1 MB). I dati di ogni ateneo l'app li scarica da internet per
      # l'ateneo scelto: niente --completo, la build resta leggera.
      - name: Elenco degli atenei e dei corsi nell'app (i dati dell'ateneo si scaricano)
        shell: bash
        run: python3 ../tools/db_builder/sync_assets.py || python ../tools/db_builder/sync_assets.py
      # Parakeet (NVIDIA, CC BY 4.0) incluso nell'app desktop: 670 MB scaricati
      # una volta da Hugging Face con lo SHA-256 controllato, poi presi dalla
      # cache (mai nel repository). Sul Mac vanno in
      # UniNotes.app/Contents/Resources/parakeet, prima della firma.
      - name: Cache del modello Parakeet
        uses: actions/cache@v4
        with:
          path: app/build/parakeet
          key: parakeet-tdt-0.6b-v3-int8-acfc2b44
      - name: Modello Parakeet (incluso nell'app, 670 MB, non nel repository)
        shell: bash
        run: python3 tool/prepara_modello_parakeet.py || python tool/prepara_modello_parakeet.py
      # niente modello Whisper integrato: su Mac il testo dal vivo è di
      # Parakeet (l'asset di Whisper è solo per Android e iOS)
      - run: flutter build macos --release --dart-define=MS_CLIENT_ID=${{ secrets.MS_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID_DESKTOP }} --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET_DESKTOP }} --dart-define=DONATIONS=link --dart-define=GOOGLE_PICKER_API_KEY=${{ secrets.GOOGLE_PICKER_API_KEY }} --dart-define=GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
      - name: Parakeet dentro UniNotes.app (modello, Silero VAD e licenze)
        shell: bash
        run: python3 tool/prepara_modello_parakeet.py --installa build/macos/Build/Products/Release/UniNotes.app/Contents/Resources/parakeet
      # Firma con il certificato «Developer ID Application» e notarizzazione
      # di Apple: richiedono l'account Apple Developer. Senza i secret questi
      # passi non partono e la build resta non firmata.
      - name: Firma UniNotes.app (solo con il certificato nei secret)
        if: env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p temporanea "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p temporanea "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k temporanea "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGN_IDENTITY" build/macos/Build/Products/Release/UniNotes.app
      - name: Comprimi
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent "UniNotes.app" "$GITHUB_WORKSPACE/app/uninotes-macos.zip"
      # UniNotes.dmg: si apre e si trascina UniNotes in Applicazioni.
      - name: Immagine disco UniNotes.dmg
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto build/macos/Build/Products/Release/UniNotes.app "$STAGE/UniNotes.app"
          ln -s /Applications "$STAGE/Applicazioni"
          # icona del disco: quella dell'app (AppIcon.icns nel pacchetto). Se
          # un passo non riesce si crea il disco senza icona, come prima.
          if cp "$STAGE/UniNotes.app/Contents/Resources/AppIcon.icns" "$STAGE/.VolumeIcon.icns" \
            && hdiutil create -volname "UniNotes" -srcfolder "$STAGE" -ov -format UDRW "$RUNNER_TEMP/rw.dmg" \
            && MNT=$(hdiutil attach -readwrite -noverify -noautoopen "$RUNNER_TEMP/rw.dmg" | awk -F'\t' '/\/Volumes\//{print $NF}') \
            && [ -n "$MNT" ]; then
            xcrun SetFile -a C "$MNT" || SetFile -a C "$MNT" || echo "icona del disco non impostata"
            hdiutil detach "$MNT"
            hdiutil convert "$RUNNER_TEMP/rw.dmg" -format UDZO -o UniNotes.dmg -ov
          else
            rm -f "$STAGE/.VolumeIcon.icns"
            hdiutil create -volname "UniNotes" -srcfolder "$STAGE" -ov -format UDZO UniNotes.dmg
          fi
      - name: Firma e notarizzazione di UniNotes.dmg (solo con i secret)
        if: env.HAS_MACOS_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" UniNotes.dmg
          xcrun notarytool submit UniNotes.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" --wait
          xcrun stapler staple UniNotes.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: uninotes-macos
          retention-days: 3
          path: |
            app/uninotes-macos.zip
            app/UniNotes.dmg

  ios:
    name: iOS (non firmata)
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Solo i file comuni (atenei, indice dei corsi, meta, corsi sostituiti:
      # circa 1 MB). I dati di ogni ateneo l'app li scarica da internet per
      # l'ateneo scelto: niente --completo, la build resta leggera.
      - name: Elenco degli atenei e dei corsi nell'app (i dati dell'ateneo si scaricano)
        shell: bash
        run: python3 ../tools/db_builder/sync_assets.py || python ../tools/db_builder/sync_assets.py
      - name: Modello Whisper integrato (asset delle build Android e iOS, 57 MiB, non nel repository)
        shell: bash
        run: python3 tool/prepara_modello_whisper.py || python tool/prepara_modello_whisper.py
      - run: flutter build ios --release --no-codesign --dart-define=MS_CLIENT_ID=${{ secrets.MS_CLIENT_ID }} --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID_IOS }} --dart-define=GOOGLE_PICKER_API_KEY=${{ secrets.GOOGLE_PICKER_API_KEY }} --dart-define=GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
      - name: Comprimi (IPA non firmato, da firmare con il proprio account Apple)
        run: |
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr uninotes-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: uninotes-ios-unsigned
          retention-days: 3
          path: app/uninotes-ios-unsigned.ipa

  # «Ultima build»: a ogni modifica del ramo principale una release di prova
  # (sempre la stessa, sostituita) con i file di tutte le piattaforme,
  # scaricabili da chiunque senza account GitHub.
  ultima-build:
    name: Ultima build (release scaricabile)
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [android, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: File con nomi chiari
        run: |
          mkdir out
          # arm64: quasi tutti i telefoni (stesso nome di prima, i link restano validi)
          cp dist/uninotes-android/flutter-apk/app-arm64-v8a-release.apk out/UniNotes-android.apk
          cp dist/uninotes-android/flutter-apk/app-armeabi-v7a-release.apk out/UniNotes-android-32bit.apk
          cp dist/uninotes-android/flutter-apk/app-x86_64-release.apk out/UniNotes-android-x86_64.apk
          cp dist/uninotes-windows/uninotes-windows.zip out/UniNotes-windows.zip
          cp dist/uninotes-windows/UniNotes_setup.exe out/UniNotes_setup.exe
          cp dist/uninotes-macos/uninotes-macos.zip out/UniNotes-macos.zip
          cp dist/uninotes-macos/UniNotes.dmg out/UniNotes.dmg
          cp dist/uninotes-ios-unsigned/uninotes-ios-unsigned.ipa out/UniNotes-ios-non-firmata.ipa
      - name: Sostituisci la release «ultima-build»
        run: gh release delete ultima-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ultima-build
          target_commitish: ${{ github.sha }}
          name: Ultima build (versione di prova)
          prerelease: true
          make_latest: false
          body: |
            Versione di prova creata automaticamente dall'ultima modifica (commit ${{ github.sha }}).
            Non è firmata: Windows e macOS mostrano un avviso al primo avvio.

            - **Windows**: `UniNotes_setup.exe` → avvialo e segui l'installazione (senza permessi di amministratore; collegamento nel menu Start, disinstallazione da «App installate»). Alternativa senza installazione: `UniNotes-windows.zip` → estrai la cartella e apri `uninotes.exe`.
            - **macOS**: `UniNotes.dmg` → aprilo e trascina UniNotes in Applicazioni; al primo avvio Impostazioni di Sistema → Privacy e sicurezza → Apri comunque (l'app non è ancora firmata). Alternativa: `UniNotes-macos.zip`.
            - **Android**: `UniNotes-android.apk` (quasi tutti i telefoni, processore a 64 bit) → apri il file sul telefono e consenti l'installazione.
              Telefoni vecchi a 32 bit: `UniNotes-android-32bit.apk`; Chromebook ed emulatori x86: `UniNotes-android-x86_64.apk`.
            - **iPhone/iPad**: `UniNotes-ios-non-firmata.ipa` → va firmata con il proprio account Apple (es. Sideloadly o AltStore).

            Per togliere l'app con tutti i suoi dati (anche nel cloud e nel calendario): in UniNotes *Impostazioni → Privacy e informazioni → Disinstalla UniNotes*.

            Istruzioni complete: [INSTALLAZIONE.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/INSTALLAZIONE.md)
          files: out/*
      # Le versioni vecchie non restano: si eliminano gli artefatti delle build
      # precedenti (la versione aggiornata è nella release «ultima-build»),
      # tranne il pacchetto per il Microsoft Store, che resta finché non scade
      # (30 giorni) per caricarlo in Partner Center.
      - name: Elimina le versioni vecchie
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != '"$GITHUB_RUN_ID"' and .name != "uninotes-microsoft-store") | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done

  release:
    name: Release (solo tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          # i tag con "-" (es. v2026.9.0-beta.1) sono versioni di prova
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Come installare ogni versione: [INSTALLAZIONE.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/INSTALLAZIONE.md)
          files: |
            dist/uninotes-android/flutter-apk/app-*-release.apk
            dist/uninotes-windows/uninotes-windows.zip
            dist/uninotes-windows/UniNotes_setup.exe
            dist/uninotes-macos/uninotes-macos.zip
            dist/uninotes-macos/UniNotes.dmg
            dist/uninotes-ios-unsigned/uninotes-ios-unsigned.ipa
